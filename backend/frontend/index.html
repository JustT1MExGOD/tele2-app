<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tele2 Sales</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: var(--tg-theme-bg-color, #0f0f12);
      --text: var(--tg-theme-text-color, #f2f2f7);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --button: var(--tg-theme-button-color, #2aabee);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary: var(--tg-theme-secondary-bg-color, #1c1c1e);
      --card: var(--tg-theme-secondary-bg-color, #1c1c1e);
      --success: #34c759;
      --danger: #ff453a;
      --warning: #ff9f0a;
      --border: rgba(255,255,255,0.06);
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px 14px 110px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header .date {
      font-size: 13px;
      color: var(--hint);
      background: var(--secondary);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    /* ===== Tabs ===== */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      padding: 9px 14px;
      border-radius: 12px;
      background: var(--secondary);
      color: var(--hint);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--button);
      color: var(--button-text);
    }
    .tab:active { transform: scale(0.96); }

    /* ===== Cards ===== */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .card-title .badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      color: var(--hint);
      background: var(--bg);
      padding: 3px 8px;
      border-radius: 8px;
    }

    /* ===== Stats grid ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-item {
      background: var(--bg);
      padding: 14px 8px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--button);
      line-height: 1.1;
    }
    .stat-label {
      font-size: 10px;
      color: var(--hint);
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }

    /* ===== Store card (План дня) ===== */
    .store-card {
      background: var(--card);
      border-radius: var(--radius);
      margin-bottom: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .store-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }
    .store-header:active { opacity: 0.85; }
    .store-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2aabee, #1a8fd0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .store-info { flex: 1; min-width: 0; }
    .store-name {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .store-meta {
      font-size: 12px;
      color: var(--hint);
      margin-top: 2px;
    }
    .store-pct {
      font-size: 16px;
      font-weight: 700;
      min-width: 48px;
      text-align: right;
    }
    .store-pct.good { color: var(--success); }
    .store-pct.mid { color: var(--warning); }
    .store-pct.bad { color: var(--danger); }
    .store-chevron {
      color: var(--hint);
      font-size: 18px;
      transition: transform 0.25s;
      margin-left: 4px;
    }
    .store-card.open .store-chevron { transform: rotate(180deg); }

    .store-body {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
    }
    .store-card.open .store-body { display: block; }

    .block-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 14px 0 8px;
    }

    .staff-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .staff-chip {
      font-size: 12px;
      background: var(--bg);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    /* ===== Progress ===== */
    .progress-item { margin-bottom: 10px; }
    .progress-item:last-child { margin-bottom: 0; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 5px;
      gap: 8px;
    }
    .progress-label .name { font-weight: 500; }
    .progress-label .value {
      color: var(--hint);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .progress-bar {
      width: 100%;
      height: 7px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--button);
      transition: width 0.5s ease;
      min-width: 0;
    }
    .progress-fill.done { background: var(--success); }
    .progress-fill.fail { background: var(--danger); }
    .progress-fill.warning { background: var(--warning); }

    /* ===== Lists ===== */
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .list-item:last-child { border-bottom: none; }
    .list-name { font-weight: 500; font-size: 14px; flex: 1; min-width: 0; }
    .list-stats {
      font-size: 12px;
      color: var(--hint);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .rank {
      font-weight: 700;
      color: var(--button);
      width: 28px;
      flex-shrink: 0;
    }
    .score {
      font-weight: 700;
      color: var(--button);
      font-size: 14px;
    }

    /* ===== FAB ===== */
    .fab {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 420px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: var(--button);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(42, 171, 238, 0.35);
      z-index: 50;
      transition: transform 0.15s;
    }
    .fab:active { transform: translateX(-50%) scale(0.97); }

    /* ===== Empty / Loading ===== */
    .empty-state, .loading {
      text-align: center;
      padding: 28px 12px;
      color: var(--hint);
      font-size: 14px;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 12px 20px;
      border-radius: 12px;
      background: rgba(30,30,32,0.95);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      padding: 20px 18px 28px;
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow-y: auto;
      animation: slideUp 0.28s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }
    .modal-close {
      background: var(--secondary);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: var(--hint);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .input-group { margin-bottom: 14px; }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--hint);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .input-group input,
    .input-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--secondary);
      color: var(--text);
      font-size: 15px;
      outline: none;
      appearance: none;
    }
    .input-group input:focus,
    .input-group select:focus {
      border-color: var(--button);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .metric-chip {
      padding: 12px 6px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--secondary);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .metric-chip.selected {
      background: var(--button);
      color: var(--button-text);
      border-color: var(--button);
    }
    .metric-chip:active { transform: scale(0.96); }

    .btn-primary {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: var(--button);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.45; }

    .quick-values {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .quick-values button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--secondary);
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .quick-values button:active { background: var(--button); color: var(--button-text); }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div id="modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">Добавить продажу</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="app">
    <div class="header">
      <h1>🍉 Tele2 Sales</h1>
      <span class="date" id="currentDate">—</span>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Дашборд</button>
      <button class="tab" data-tab="plan" onclick="switchTab('plan')">📋 План дня</button>
      <button class="tab" data-tab="employees" onclick="switchTab('employees')">👥 Сотрудники</button>
      <button class="tab" data-tab="my" onclick="switchTab('my')">👤 Мой план</button>
    </div>

    <!-- Dashboard -->
    <div id="tab-dashboard">
      <div class="card">
        <div class="card-title">📈 Продажи сегодня</div>
        <div class="stats-grid">
          <div class="stat-item"><div class="stat-value" id="statSim">0</div><div class="stat-label">SIM</div></div>
          <div class="stat-item"><div class="stat-value" id="statMnp">0</div><div class="stat-label">MNP</div></div>
          <div class="stat-item"><div class="stat-value" id="statPa">0</div><div class="stat-label">ПА</div></div>
          <div class="stat-item"><div class="stat-value" id="statCombo">0</div><div class="stat-label">Комбо</div></div>
          <div class="stat-item"><div class="stat-value" id="statPhones">0</div><div class="stat-label">Телефоны</div></div>
          <div class="stat-item"><div class="stat-value" id="statAccessories">0</div><div class="stat-label">Аксессуары</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🏆 Топ сотрудников</div>
        <div id="topEmployees"><div class="loading">Загрузка</div></div>
      </div>
    </div>

    <!-- Plan day -->
    <div id="tab-plan" style="display:none;">
      <div id="planStores"><div class="loading">Загрузка</div></div>
    </div>

    <!-- Employees -->
    <div id="tab-employees" style="display:none;">
      <div class="card">
        <div class="card-title">👥 Все сотрудники</div>
        <div id="employeesList"><div class="loading">Загрузка</div></div>
      </div>
    </div>

    <!-- My plan -->
    <div id="tab-my" style="display:none;">
      <div class="card">
        <div class="card-title">📋 Мой план на сегодня</div>
        <div id="myProgress"><div class="loading">Загрузка</div></div>
      </div>
    </div>

    <button class="fab" onclick="openAddSale()">➕ Добавить продажу</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('secondary_bg_color'); } catch (_) {}

    const API_URL = window.location.origin;
    let currentTab = 'dashboard';
    let employees = [];
    let stores = [];
    let selectedMetric = 'sim';

    // ===== Dates (Moscow) =====
    function todayMoscow() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Moscow',
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());
    }

    function formatDateRu(isoDate) {
      try {
        const [y, m, d] = isoDate.split('-');
        return d + '.' + m;
      } catch {
        return isoDate;
      }
    }

    function showToast(message, type = '') {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.className = 'toast show ' + type;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2500);
    }

    function pctClass(p) {
      if (p >= 100) return 'done';
      if (p >= 70) return 'warning';
      return 'fail';
    }

    function pctTone(p) {
      if (p >= 100) return 'good';
      if (p >= 70) return 'mid';
      return 'bad';
    }

    function progressRow(label, fact, plan) {
      const f = Number(fact) || 0;
      const p = Number(plan) || 0;
      const percent = p > 0 ? Math.round((f / p) * 100) : (f > 0 ? 100 : 0);
      const width = Math.min(percent, 100);
      return `
        <div class="progress-item">
          <div class="progress-label">
            <span class="name">${label}</span>
            <span class="value">${f} / ${p}${p ? ' · ' + percent + '%' : ''}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill ${pctClass(percent)}" style="width:${width}%"></div>
          </div>
        </div>`;
    }

    // ===== Tabs =====
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.querySelectorAll('[id^="tab-"]').forEach(el => el.style.display = 'none');
      document.getElementById('tab-' + tab).style.display = 'block';

      if (tab === 'dashboard') {
        loadDashboard();
        loadTopEmployees();
      }
      if (tab === 'plan') loadPlanDay();
      if (tab === 'employees') loadEmployees();
      if (tab === 'my') loadMyProgress();
    }

    // ===== Dashboard =====
    async function loadDashboard() {
      try {
        const res = await fetch(API_URL + '/stats/daily?date=' + todayMoscow());
        const data = await res.json();
        const list = Array.isArray(data) ? data : [];

        const totals = list.reduce((acc, s) => ({
          sim: acc.sim + (Number(s.sim) || 0),
          mnp: acc.mnp + (Number(s.mnp) || 0),
          pa: acc.pa + (Number(s.pa) || 0),
          combo: acc.combo + (Number(s.combo) || 0),
          phones: acc.phones + (Number(s.phones) || 0),
          accessories: acc.accessories + (Number(s.accessories) || 0)
        }), { sim: 0, mnp: 0, pa: 0, combo: 0, phones: 0, accessories: 0 });

        document.getElementById('statSim').textContent = totals.sim;
        document.getElementById('statMnp').textContent = totals.mnp;
        document.getElementById('statPa').textContent = totals.pa;
        document.getElementById('statCombo').textContent = totals.combo;
        document.getElementById('statPhones').textContent = totals.phones;
        document.getElementById('statAccessories').textContent = totals.accessories;
      } catch (err) {
        console.error(err);
      }
    }

    async function loadTopEmployees() {
      try {
        const res = await fetch(API_URL + '/sales?date=' + todayMoscow());
        const sales = await res.json();
        const list = Array.isArray(sales) ? sales : [];

        const map = {};
        list.forEach(s => {
          if (!map[s.employee_id]) {
            map[s.employee_id] = { name: s.full_name, total: 0 };
          }
          map[s.employee_id].total +=
            (Number(s.sim) || 0) + (Number(s.mnp) || 0) + (Number(s.pa) || 0) +
            (Number(s.combo) || 0) + (Number(s.phones) || 0);
        });

        const sorted = Object.values(map).sort((a, b) => b.total - a.total);
        const box = document.getElementById('topEmployees');

        if (!sorted.length) {
          box.innerHTML = '<div class="empty-state">Нет продаж сегодня</div>';
          return;
        }

        box.innerHTML = sorted.slice(0, 5).map((e, i) => `
          <div class="list-item">
            <span class="rank">#${i + 1}</span>
            <span class="list-name">${e.name}</span>
            <span class="score">${e.total}</span>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    // ===== Plan day (главный экран как в таблице) =====
    async function loadPlanDay() {
      const box = document.getElementById('planStores');
      box.innerHTML = '<div class="loading">Загрузка</div>';

      try {
        const date = todayMoscow();
        const [storesRes, statsRes, schedRes, plansRes] = await Promise.all([
          fetch(API_URL + '/stores'),
          fetch(API_URL + '/stats/daily?date=' + date),
          fetch(API_URL + '/schedules?date=' + date),
          fetch(API_URL + '/plans').catch(() => null)
        ]);

        stores = await storesRes.json();
        const stats = await statsRes.json();
        const schedules = await schedRes.json();
        let plans = [];
        if (plansRes && plansRes.ok) {
          plans = await plansRes.json();
        }

        const statsMap = {};
        (Array.isArray(stats) ? stats : []).forEach(s => {
          statsMap[s.store_id || s.id] = s;
        });

        const planMap = {};
        (Array.isArray(plans) ? plans : []).forEach(p => {
          if (p.plan_date == null || p.plan_date === date) {
            planMap[p.store_id] = p;
          }
        });

        // fallback: plan fields may live on store object
        (Array.isArray(stores) ? stores : []).forEach(st => {
          if (!planMap[st.id] && (st.sim != null || st.plan_sim != null)) {
            planMap[st.id] = {
              sim: st.plan_sim ?? st.sim ?? 0,
              mnp: st.plan_mnp ?? st.mnp ?? 0,
              pa: st.plan_pa ?? st.pa ?? 0,
              combo: st.plan_combo ?? st.combo ?? 0,
              phones: st.plan_phones ?? st.phones ?? 0,
              accessories: st.plan_accessories ?? st.accessories ?? 0,
              insurance: st.plan_insurance ?? st.insurance ?? 0,
              wink: st.plan_wink ?? st.wink ?? 0,
              shpd: st.plan_shpd ?? st.shpd ?? 0,
              focus: st.plan_focus ?? st.focus ?? 0,
              settings: st.plan_settings ?? st.settings ?? 0,
              credit_request: st.plan_credit_request ?? st.credit_request ?? 0,
              credit_issued: st.plan_credit_issued ?? st.credit_issued ?? 0
            };
          }
        });

        const staffByStore = {};
        (Array.isArray(schedules) ? schedules : []).forEach(sch => {
          if (!staffByStore[sch.store_id]) staffByStore[sch.store_id] = [];
          staffByStore[sch.store_id].push(sch);
        });

        const storeList = Array.isArray(stores) ? stores.slice().sort((a, b) => (a.hours || 0) - (b.hours || 0)) : [];

        if (!storeList.length) {
          box.innerHTML = '<div class="empty-state">Нет точек</div>';
          return;
        }

        box.innerHTML = storeList.map((store, idx) => {
          const fact = statsMap[store.id] || {};
          const plan = planMap[store.id] || {};
          const staff = staffByStore[store.id] || [];

          const keys = ['sim', 'mnp', 'pa', 'combo', 'phones'];
          let sumFact = 0, sumPlan = 0;
          keys.forEach(k => {
            sumFact += Number(fact[k]) || 0;
            sumPlan += Number(plan[k]) || 0;
          });
          const overall = sumPlan > 0 ? Math.round((sumFact / sumPlan) * 100) : (sumFact > 0 ? 100 : 0);

          const staffHtml = staff.length
            ? `<div class="staff-chips">${staff.map(s =>
                `<span class="staff-chip">${s.full_name || 'Сотрудник'}${s.shift_text ? ' · ' + s.shift_text : ''}</span>`
              ).join('')}</div>`
            : `<div class="store-meta" style="margin-top:8px">Нет сотрудников на смене</div>`;

          return `
            <div class="store-card ${idx === 0 ? 'open' : ''}" id="store-${store.id}">
              <div class="store-header" onclick="toggleStore('${store.id}')">
                <div class="store-icon">📍</div>
                <div class="store-info">
                  <div class="store-name">${store.name || store.id}</div>
                  <div class="store-meta">${store.code || ''} · ${store.work_time || ''}</div>
                </div>
                <div class="store-pct ${pctTone(overall)}">${overall}%</div>
                <div class="store-chevron">▾</div>
              </div>
              <div class="store-body">
                ${staffHtml}

                <div class="block-title">Блок GI</div>
                ${progressRow('Симкарты', fact.sim, plan.sim)}
                ${progressRow('MNP', fact.mnp, plan.mnp)}
                ${progressRow('Абики / золото', fact.pa, plan.pa)}

                <div class="block-title">Топ ап и товарка</div>
                ${progressRow('Комбо', fact.combo, plan.combo)}
                ${progressRow('Телефоны', fact.phones, plan.phones)}
                ${progressRow('Аксессуары', fact.accessories, plan.accessories)}
                ${progressRow('Страховки', fact.insurance, plan.insurance)}
                ${progressRow('Настройки', fact.settings, plan.settings)}

                <div class="block-title">Ростелеком</div>
                ${progressRow('WINK', fact.wink, plan.wink)}
                ${progressRow('ШПД', fact.shpd, plan.shpd)}
                ${progressRow('ФО', fact.focus, plan.focus)}

                <div class="block-title">Кредиты</div>
                ${progressRow('Заявка', fact.credit_request, plan.credit_request)}
                ${progressRow('Выданный', fact.credit_issued, plan.credit_issued)}
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        console.error(err);
        box.innerHTML = '<div class="empty-state">Ошибка загрузки плана</div>';
      }
    }

    function toggleStore(id) {
      const el = document.getElementById('store-' + id);
      if (el) el.classList.toggle('open');
    }

    // ===== Employees =====
    async function loadEmployees() {
      try {
        const [empRes, salesRes] = await Promise.all([
          fetch(API_URL + '/employees'),
          fetch(API_URL + '/sales?date=' + todayMoscow())
        ]);
        employees = await empRes.json();
        const sales = await salesRes.json();

        const map = {};
        (Array.isArray(sales) ? sales : []).forEach(s => {
          if (!map[s.employee_id]) map[s.employee_id] = { sim: 0, combo: 0, phones: 0 };
          map[s.employee_id].sim += Number(s.sim) || 0;
          map[s.employee_id].combo += Number(s.combo) || 0;
          map[s.employee_id].phones += Number(s.phones) || 0;
        });

        const box = document.getElementById('employeesList');
        const list = Array.isArray(employees) ? employees : [];
        if (!list.length) {
          box.innerHTML = '<div class="empty-state">Нет сотрудников</div>';
          return;
        }

        box.innerHTML = list.map(e => {
          const st = map[e.id] || { sim: 0, combo: 0, phones: 0 };
          return `
            <div class="list-item">
              <span class="list-name">${e.full_name}</span>
              <span class="list-stats">
                <span>SIM ${st.sim}</span>
                <span>К ${st.combo}</span>
                <span>Т ${st.phones}</span>
              </span>
            </div>`;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    }

    // ===== My progress =====
    async function loadMyProgress() {
      // TODO: привязать telegram_id -> employee_id
      const employeeId = 1;
      const box = document.getElementById('myProgress');

      try {
        const res = await fetch(API_URL + '/employee/progress/' + employeeId + '?date=' + todayMoscow());
        if (!res.ok) throw new Error('fail');
        const data = await res.json();

        const metrics = [
          { key: 'sim', label: 'SIM' },
          { key: 'mnp', label: 'MNP' },
          { key: 'pa', label: 'ПА' },
          { key: 'combo', label: 'Комбо' },
          { key: 'phones', label: 'Телефоны' }
        ];

        let html = '';
        for (const m of metrics) {
          const plan = data[m.key]?.plan ?? 0;
          const fact = data[m.key]?.fact ?? 0;
          html += progressRow(m.label, fact, plan);
        }

        if (data.total) {
          html += `
            <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
              ${progressRow('Итого', data.total.fact, data.total.plan)}
            </div>`;
        }

        box.innerHTML = html || '<div class="empty-state">Нет плана на сегодня</div>';
      } catch (err) {
        box.innerHTML = '<div class="empty-state">Нет данных по сотруднику</div>';
      }
    }

    // ===== Add sale modal =====
    const METRICS = [
      { id: 'sim', label: 'SIM' },
      { id: 'mnp', label: 'MNP' },
      { id: 'pa', label: 'ПА' },
      { id: 'combo', label: 'Комбо' },
      { id: 'phones', label: 'Телефон' },
      { id: 'accessories', label: 'Аксы' },
      { id: 'insurance', label: 'Страх' },
      { id: 'wink', label: 'Wink' },
      { id: 'shpd', label: 'ШПД' },
      { id: 'focus', label: 'ФО' },
      { id: 'plotter', label: 'Плоттер' },
      { id: 'hb', label: 'HB' }
    ];

    async function openAddSale() {
      try {
        const [empRes, storeRes] = await Promise.all([
          fetch(API_URL + '/employees'),
          fetch(API_URL + '/stores')
        ]);
        employees = await empRes.json();
        stores = await storeRes.json();

        if (!employees.length) {
          showToast('Нет сотрудников', 'error');
          return;
        }

        selectedMetric = 'sim';
        document.getElementById('modalBody').innerHTML = `
          <div class="input-group">
            <label>Сотрудник</label>
            <select id="modalEmployee">
              ${employees.map(e => `<option value="${e.id}">${e.full_name}</option>`).join('')}
            </select>
          </div>
          <div class="input-group">
            <label>Точка</label>
            <select id="modalStore">
              ${stores.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
            </select>
          </div>
          <div class="input-group">
            <label>Тип продажи</label>
            <div class="metric-grid" id="metricGrid">
              ${METRICS.map(m => `
                <button type="button" class="metric-chip ${m.id === 'sim' ? 'selected' : ''}"
                  data-metric="${m.id}" onclick="pickMetric('${m.id}')">${m.label}</button>
              `).join('')}
            </div>
          </div>
          <div class="input-group">
            <label>Количество</label>
            <input type="number" id="modalValue" inputmode="decimal" placeholder="Число" min="1" value="1">
            <div class="quick-values">
              <button type="button" onclick="setVal(1)">1</button>
              <button type="button" onclick="setVal(2)">2</button>
              <button type="button" onclick="setVal(5)">5</button>
              <button type="button" onclick="setVal(10)">10</button>
            </div>
          </div>
          <button class="btn-primary" onclick="submitSale()">✅ Добавить</button>
        `;

        document.getElementById('modalTitle').textContent = 'Добавить продажу';
        document.getElementById('modal').classList.add('show');
      } catch (err) {
        console.error(err);
        showToast('Ошибка загрузки', 'error');
      }
    }

    function pickMetric(id) {
      selectedMetric = id;
      document.querySelectorAll('.metric-chip').forEach(b => {
        b.classList.toggle('selected', b.dataset.metric === id);
      });
    }

    function setVal(n) {
      document.getElementById('modalValue').value = n;
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    async function submitSale() {
      const employeeId = document.getElementById('modalEmployee').value;
      const storeId = document.getElementById('modalStore').value;
      const value = Number(String(document.getElementById('modalValue').value).replace(',', '.'));

      if (!value || value <= 0) {
        showToast('Введите количество', 'error');
        return;
      }

      try {
        const body = {
          employee_id: Number(employeeId),
          store_id: storeId,
          sale_date: todayMoscow(),
          [selectedMetric]: value
        };

        const res = await fetch(API_URL + '/sales', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) throw new Error('server');

        closeModal();
        showToast('Добавлено: ' + value, 'success');
        refreshCurrent();
      } catch (err) {
        console.error(err);
        showToast('Ошибка при добавлении', 'error');
      }
    }

    function refreshCurrent() {
      document.getElementById('currentDate').textContent = formatDateRu(todayMoscow());
      if (currentTab === 'dashboard') {
        loadDashboard();
        loadTopEmployees();
      } else if (currentTab === 'plan') {
        loadPlanDay();
      } else if (currentTab === 'employees') {
        loadEmployees();
      } else if (currentTab === 'my') {
        loadMyProgress();
      }
    }

    // init
    refreshCurrent();
    setInterval(() => {
      if (currentTab === 'dashboard') {
        loadDashboard();
        loadTopEmployees();
      }
    }, 30000);

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    console.log('Tele2 Mini App ready');
  </script>
</body>
</html>
