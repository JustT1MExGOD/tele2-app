<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tele2 Sales</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root, [data-theme="light"] {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --surface-2: #f2f2f7;
      --text: #111111;
      --text-secondary: #6b6b6b;
      --hint: #8e8e93;
      --border: rgba(0,0,0,0.06);
      --accent: #000000;
      --accent-soft: #f2f2f7;
      --primary: #2aabee;
      --primary-soft: rgba(42,171,238,0.12);
      --success: #34c759;
      --danger: #ff3b30;
      --warning: #ff9500;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --header-bg: #000000;
      --header-text: #ffffff;
      --nav-bg: #ffffff;
      --nav-border: rgba(0,0,0,0.08);
      --icon-bg: #f2f2f7;
      --radius: 20px;
      --radius-sm: 14px;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --text: #f2f2f7;
      --text-secondary: #aeaeb2;
      --hint: #8e8e93;
      --border: rgba(255,255,255,0.08);
      --accent: #ffffff;
      --accent-soft: #2c2c2e;
      --primary: #2aabee;
      --primary-soft: rgba(42,171,238,0.18);
      --success: #30d158;
      --danger: #ff453a;
      --warning: #ff9f0a;
      --shadow: 0 2px 16px rgba(0,0,0,0.4);
      --header-bg: #000000;
      --header-text: #ffffff;
      --nav-bg: #1c1c1e;
      --nav-border: rgba(255,255,255,0.1);
      --icon-bg: #2c2c2e;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      padding-bottom: 88px;
      min-height: 100vh;
    }

    /* ===== Top header (как на скрине) ===== */
    .app-header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 12px 16px 28px;
      position: relative;
    }
    .app-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .store-pill {
      display: inline-block;
      background: #fff;
      color: #111;
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      max-width: 70%;
    }
    [data-theme="dark"] .store-pill {
      background: #1c1c1e;
      color: #f2f2f7;
    }
    .store-pill .label {
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 2px;
    }
    .store-pill .value {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    /* ===== Sheet content ===== */
    .sheet {
      margin-top: -16px;
      background: var(--bg);
      border-radius: 24px 24px 0 0;
      padding: 16px 14px 20px;
      min-height: calc(100vh - 120px);
    }

    .section {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 6px 0;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      padding: 14px 16px 8px;
    }
    .section-sub {
      font-size: 12px;
      color: var(--hint);
      font-weight: 500;
    }

    /* List rows (как Продать SIM) */
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      color: var(--text);
      font: inherit;
    }
    .row:active { background: var(--surface-2); }
    .row-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      color: var(--text-secondary);
    }
    .row-body { flex: 1; min-width: 0; }
    .row-title {
      font-size: 16px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-sub {
      font-size: 13px;
      color: var(--hint);
      margin-top: 2px;
    }
    .row-chevron {
      color: var(--hint);
      font-size: 18px;
      font-weight: 300;
      flex-shrink: 0;
    }
    .row-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }

    /* Stats chips */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 4px 12px 14px;
    }
    .stat-chip {
      background: var(--surface-2);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
    }
    .stat-chip .n {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    .stat-chip .l {
      font-size: 10px;
      color: var(--hint);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-top: 3px;
    }

    /* Progress */
    .progress-block { padding: 4px 16px 14px; }
    .progress-item { margin-bottom: 12px; }
    .progress-item:last-child { margin-bottom: 0; }
    .progress-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      gap: 8px;
    }
    .progress-top .name { font-weight: 600; }
    .progress-top .val { color: var(--hint); font-variant-numeric: tabular-nums; }
    .bar {
      height: 6px;
      background: var(--surface-2);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      border-radius: 3px;
      background: var(--primary);
      transition: width 0.45s ease;
    }
    .bar > i.good { background: var(--success); }
    .bar > i.mid { background: var(--warning); }
    .bar > i.bad { background: var(--danger); }

    /* Store plan cards */
    .store-card {
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .store-head {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .store-head:active { opacity: 0.85; }
    .store-badge {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
    }
    .store-meta { flex: 1; min-width: 0; }
    .store-name { font-size: 16px; font-weight: 700; }
    .store-code { font-size: 12px; color: var(--hint); margin-top: 2px; }
    .store-pct {
      font-size: 16px;
      font-weight: 800;
      min-width: 44px;
      text-align: right;
    }
    .store-pct.good { color: var(--success); }
    .store-pct.mid { color: var(--warning); }
    .store-pct.bad { color: var(--danger); }
    .store-body {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
    }
    .store-card.open .store-body { display: block; }
    .block-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 14px 0 8px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      font-size: 12px;
      background: var(--surface-2);
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    /* Schedule month */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 12px;
      gap: 8px;
    }
    .month-nav button {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: var(--surface);
      color: var(--text);
      font-size: 20px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .month-nav .label {
      font-size: 16px;
      font-weight: 800;
    }
    .sch-emp {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .sch-emp-head {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 14px;
    }
    .sch-emp-head .cnt { font-size: 12px; color: var(--hint); font-weight: 600; }
    .sch-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 10px;
    }
    .sch-cell {
      aspect-ratio: 1;
      border-radius: 10px;
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--hint);
      min-height: 40px;
    }
    .sch-cell .d { font-size: 13px; font-weight: 700; color: var(--text); }
    .sch-cell.work {
      background: var(--primary-soft);
      color: var(--primary);
    }
    .sch-cell.work .d { color: var(--primary); }
    .sch-cell .s {
      font-size: 8px;
      margin-top: 1px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 1px;
    }
    .sch-cell.off { opacity: 0.5; }

    /* Today schedule list */
    .today-store {
      margin-bottom: 4px;
    }

    /* FAB */
    .fab {
      position: fixed;
      right: 16px;
      bottom: 96px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 28px;
      font-weight: 300;
      box-shadow: 0 8px 24px rgba(42,171,238,0.4);
      z-index: 80;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .fab:active { transform: scale(0.94); }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: var(--nav-bg);
      border-top: 1px solid var(--nav-border);
      display: flex;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--hint);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 2px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-item .ico { font-size: 22px; line-height: 1; }
    .nav-item.active { color: var(--text); }

    /* Empty / loading / skeleton */
    .empty {
      text-align: center;
      padding: 32px 16px;
      color: var(--hint);
      font-size: 14px;
    }
    .skeleton {
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: sk 1.2s ease infinite;
      border-radius: 10px;
      height: 16px;
      margin: 10px 16px;
    }
    @keyframes sk {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: rgba(20,20,22,0.92);
      color: #fff;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      z-index: 3000;
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      max-width: 88%;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.ok { background: var(--success); }
    .toast.err { background: var(--danger); }

    /* Modal bottom sheet */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 2000;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.show { display: flex; }
    .sheet-modal {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 12px 16px 28px;
      animation: up 0.28s ease;
    }
    @keyframes up {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .grab {
      width: 36px;
      height: 4px;
      background: var(--hint);
      border-radius: 2px;
      margin: 4px auto 14px;
      opacity: 0.4;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }
    .field select, .field input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 16px;
      outline: none;
      appearance: none;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .mchip {
      padding: 12px 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .mchip.on {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .quick {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .quick button {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-main {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: var(--accent);
      color: var(--header-text);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }
    [data-theme="light"] .btn-main { color: #fff; }
    .btn-main:disabled { opacity: 0.4; }

    .page { display: none; }
    .page.active { display: block; }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
    }
    .link-row:active { background: var(--surface-2); }
    .link-row .left .t { font-size: 16px; font-weight: 600; }
    .link-row .left .s { font-size: 13px; color: var(--hint); margin-top: 2px; }
  </style>
</head>
<body data-theme="light">
  <div id="toast" class="toast"></div>

  <div id="overlay" class="overlay">
    <div class="sheet-modal">
      <div class="grab"></div>
      <div class="modal-title" id="modalTitle">Добавить продажу</div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Header -->
  <div class="app-header">
    <div class="app-header-top">
      <div class="avatar" id="userAvatar">T2</div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleTheme()" title="Тема">◐</button>
        <button class="icon-btn" onclick="refreshAll()" title="Обновить">↻</button>
      </div>
    </div>
    <div class="store-pill">
      <div class="label">Сегодня</div>
      <div class="value" id="headerDate">—</div>
    </div>
  </div>

  <div class="sheet">
    <!-- ===== MAIN ===== -->
    <div id="page-home" class="page active">
      <div class="section">
        <div class="section-title">Продажи сегодня</div>
        <div class="stats-row" id="homeStats">
          <div class="stat-chip"><div class="n" id="hSim">0</div><div class="l">SIM</div></div>
          <div class="stat-chip"><div class="n" id="hMnp">0</div><div class="l">MNP</div></div>
          <div class="stat-chip"><div class="n" id="hPa">0</div><div class="l">ПА</div></div>
          <div class="stat-chip"><div class="n" id="hCombo">0</div><div class="l">Комбо</div></div>
          <div class="stat-chip"><div class="n" id="hPhones">0</div><div class="l">Телефоны</div></div>
          <div class="stat-chip"><div class="n" id="hAcc">0</div><div class="l">Аксы</div></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Быстрые действия</div>
        <button class="row" onclick="openAddSale()">
          <div class="row-icon">➕</div>
          <div class="row-body"><div class="row-title">Добавить продажу</div></div>
          <div class="row-chevron">›</div>
        </button>
        <button class="row" onclick="switchPage('plan')">
          <div class="row-icon">📋</div>
          <div class="row-body"><div class="row-title">План дня по точкам</div></div>
          <div class="row-chevron">›</div>
        </button>
        <button class="row" onclick="switchPage('today')">
          <div class="row-icon">👥</div>
          <div class="row-body"><div class="row-title">Кто на смене сегодня</div></div>
          <div class="row-chevron">›</div>
        </button>
      </div>

      <div class="section">
        <div class="section-title">Топ сотрудников</div>
        <div id="homeTop"><div class="skeleton"></div><div class="skeleton"></div></div>
      </div>

      <div class="section">
        <button class="link-row" onclick="switchPage('bfq')">
          <div class="left">
            <div class="t">BFQ</div>
            <div class="s">Рейтинг за месяц</div>
          </div>
          <div class="row-chevron">›</div>
        </button>
      </div>
    </div>

    <!-- ===== PLAN DAY ===== -->
    <div id="page-plan" class="page">
      <div id="planList"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>

    <!-- ===== TODAY SCHEDULE ===== -->
    <div id="page-today" class="page">
      <div id="todayList"><div class="skeleton"></div></div>
    </div>

    <!-- ===== MONTH SCHEDULE ===== -->
    <div id="page-schedule" class="page">
      <div class="month-nav">
        <button onclick="shiftMonth(-1)">‹</button>
        <div class="label" id="monthLabel">—</div>
        <button onclick="shiftMonth(1)">›</button>
      </div>
      <div id="monthBoard"><div class="skeleton"></div></div>
    </div>

    <!-- ===== MY PLAN ===== -->
    <div id="page-my" class="page">
      <div class="section">
        <div class="section-title" id="myTitle">Мой план</div>
        <div id="myBody"><div class="skeleton"></div><div class="skeleton"></div></div>
      </div>
      <div class="section" id="myBindSection" style="display:none;">
        <div class="section-title">Привязка аккаунта</div>
        <div class="progress-block">
          <div class="field">
            <label>Кто вы?</label>
            <select id="bindEmployee"></select>
          </div>
          <button class="btn-main" onclick="bindMe()">Привязать Telegram</button>
        </div>
      </div>
    </div>

    <!-- ===== BFQ ===== -->
    <div id="page-bfq" class="page">
      <div class="section">
        <div class="section-title">BFQ за месяц</div>
        <div id="bfqList"><div class="skeleton"></div></div>
      </div>
    </div>

    <!-- ===== MORE / TEAM ===== -->
    <div id="page-team" class="page">
      <div class="section">
        <div class="section-title">Сотрудники</div>
        <div id="teamList"><div class="skeleton"></div></div>
      </div>
      <div class="section" id="managerTools" style="display:none;">
        <div class="section-title">Управление</div>
        <button class="row" onclick="switchPage('history')">
          <div class="row-icon">📜</div>
          <div class="row-body"><div class="row-title">История продаж</div></div>
          <div class="row-chevron">›</div>
        </button>
        <button class="row" onclick="switchPage('bfq')">
          <div class="row-icon">🏆</div>
          <div class="row-body"><div class="row-title">BFQ</div></div>
          <div class="row-chevron">›</div>
        </button>
        <button class="row" onclick="exportCSV('sales')">
          <div class="row-icon">⬇️</div>
          <div class="row-body"><div class="row-title">Экспорт продаж CSV</div></div>
          <div class="row-chevron">›</div>
        </button>
        <button class="row" onclick="exportCSV('bfq')">
          <div class="row-icon">⬇️</div>
          <div class="row-body"><div class="row-title">Экспорт BFQ CSV</div></div>
          <div class="row-chevron">›</div>
        </button>
        <button class="row" onclick="exportCSV('schedules')">
          <div class="row-icon">⬇️</div>
          <div class="row-body"><div class="row-title">Экспорт графика CSV</div></div>
          <div class="row-chevron">›</div>
        </button>
      </div>
    </div>

    <!-- ===== HISTORY ===== -->
    <div id="page-history" class="page">
      <div class="section">
        <div class="section-title">История продаж</div>
        <div id="historyList"><div class="skeleton"></div></div>
      </div>
    </div>
  </div>

  <button class="fab" onclick="openAddSale()" aria-label="Добавить">+</button>

  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home" onclick="switchPage('home')">
      <span class="ico">🏠</span>Главное
    </button>
    <button class="nav-item" data-page="plan" onclick="switchPage('plan')">
      <span class="ico">📋</span>План
    </button>
    <button class="nav-item" data-page="schedule" onclick="switchPage('schedule')">
      <span class="ico">📅</span>График
    </button>
    <button class="nav-item" data-page="my" onclick="switchPage('my')">
      <span class="ico">👤</span>Мой
    </button>
    <button class="nav-item" data-page="team" onclick="switchPage('team')">
      <span class="ico">👥</span>Команда
    </button>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('#000000'); tg.setBackgroundColor('#f2f2f7'); } catch (_) {}
    }

    const API = window.location.origin;
    let page = 'home';
    let employees = [];
    let stores = [];
    let selectedMetric = 'sim';
    let scheduleMonth = todayMoscow().slice(0, 7);
    let me = null; // { employee_id, full_name, role, is_manager }

    function canManage() {
      return me?.role === 'manager' || me?.role === 'admin' || me?.is_manager === true;
    }

    function authHeaders(json = false) {
      const h = { 'X-Telegram-Id': String(tgUser()?.id || '') };
      if (json) h['Content-Type'] = 'application/json';
      return h;
    }

    const METRICS = [
      { id: 'sim', label: 'SIM' },
      { id: 'mnp', label: 'MNP' },
      { id: 'pa', label: 'ПА' },
      { id: 'combo', label: 'Комбо' },
      { id: 'phones', label: 'Телефон' },
      { id: 'accessories', label: 'Аксы' },
      { id: 'insurance', label: 'Страх' },
      { id: 'wink', label: 'Wink' },
      { id: 'shpd', label: 'ШПД' },
      { id: 'focus', label: 'ФО' },
      { id: 'plotter', label: 'Плоттер' },
      { id: 'hb', label: 'HB' }
    ];

    // ===== Utils =====
    function todayMoscow() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Moscow',
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());
    }

    function formatDateRu(iso) {
      try {
        const [y, m, d] = iso.split('-');
        return `${d}.${m}.${y}`;
      } catch { return iso; }
    }

    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function pctTone(p) {
      if (p >= 100) return 'good';
      if (p >= 70) return 'mid';
      return 'bad';
    }

    function progressHTML(label, fact, plan) {
      const f = Number(fact) || 0;
      const p = Number(plan) || 0;
      const percent = p > 0 ? Math.round((f / p) * 100) : (f > 0 ? 100 : 0);
      const w = Math.min(percent, 100);
      return `
        <div class="progress-item">
          <div class="progress-top">
            <span class="name">${label}</span>
            <span class="val">${f} / ${p}${p ? ' · ' + percent + '%' : ''}</span>
          </div>
          <div class="bar"><i class="${pctTone(percent)}" style="width:${w}%"></i></div>
        </div>`;
    }

    function tgUser() {
      return tg?.initDataUnsafe?.user || null;
    }

    // ===== Theme =====
    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('t2_theme', theme);
      if (tg) {
        try {
          tg.setBackgroundColor(theme === 'dark' ? '#000000' : '#f2f2f7');
        } catch (_) {}
      }
    }

    function toggleTheme() {
      const cur = document.body.getAttribute('data-theme') || 'light';
      applyTheme(cur === 'light' ? 'dark' : 'light');
    }

    // ===== Navigation =====
    function switchPage(name) {
      page = name;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const el = document.getElementById('page-' + name);
      if (el) el.classList.add('active');

      document.querySelectorAll('.nav-item').forEach(n => {
        n.classList.toggle('active', n.dataset.page === name);
      });

      // hide fab on some pages optional
      if (name === 'home' || name === 'plan' || name === 'team') {
        document.querySelector('.fab').style.display = 'flex';
      }

      loadPage(name);
    }

    function loadPage(name) {
      if (name === 'home') { loadHome(); }
      if (name === 'plan') { loadPlanDay(); }
      if (name === 'today') { loadTodaySchedule(); }
      if (name === 'schedule') { loadMonthSchedule(); }
      if (name === 'my') { loadMyPlan(); }
      if (name === 'bfq') { loadBFQ(); }
      if (name === 'team') { loadTeam(); }
      if (name === 'history') { loadHistory(); }
    }

    async function refreshAll() {
      toast('Обновляю…');
      await loadPage(page);
      toast('Готово', 'ok');
    }

    // ===== HOME =====
    async function loadHome() {
      document.getElementById('headerDate').textContent = formatDateRu(todayMoscow());
      try {
        const [statsRes, salesRes] = await Promise.all([
          fetch(API + '/stats/daily?date=' + todayMoscow()),
          fetch(API + '/sales?date=' + todayMoscow())
        ]);
        const stats = await statsRes.json();
        const sales = await salesRes.json();
        const list = Array.isArray(stats) ? stats : [];

        const t = list.reduce((a, s) => ({
          sim: a.sim + (+s.sim || 0),
          mnp: a.mnp + (+s.mnp || 0),
          pa: a.pa + (+s.pa || 0),
          combo: a.combo + (+s.combo || 0),
          phones: a.phones + (+s.phones || 0),
          accessories: a.accessories + (+s.accessories || 0)
        }), { sim: 0, mnp: 0, pa: 0, combo: 0, phones: 0, accessories: 0 });

        document.getElementById('hSim').textContent = t.sim;
        document.getElementById('hMnp').textContent = t.mnp;
        document.getElementById('hPa').textContent = t.pa;
        document.getElementById('hCombo').textContent = t.combo;
        document.getElementById('hPhones').textContent = t.phones;
        document.getElementById('hAcc').textContent = t.accessories;

        const map = {};
        (Array.isArray(sales) ? sales : []).forEach(s => {
          if (!map[s.employee_id]) map[s.employee_id] = { name: s.full_name, total: 0, id: s.employee_id };
          map[s.employee_id].total += (+s.sim || 0) + (+s.mnp || 0) + (+s.pa || 0) + (+s.combo || 0) + (+s.phones || 0);
        });
        const top = Object.values(map).sort((a, b) => b.total - a.total).slice(0, 5);
        const box = document.getElementById('homeTop');
        if (!top.length) {
          box.innerHTML = '<div class="empty">Нет продаж сегодня</div>';
        } else {
          box.innerHTML = top.map((e, i) => `
            <button class="row" onclick="openEmployeeCard(${e.id})">
              <div class="row-icon">${i + 1}</div>
              <div class="row-body"><div class="row-title">${e.name}</div></div>
              <div class="row-value">${e.total}</div>
              <div class="row-chevron">›</div>
            </button>
          `).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    // ===== PLAN DAY =====
    async function loadPlanDay() {
      const box = document.getElementById('planList');
      box.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
      try {
        const date = todayMoscow();
        const [stRes, statsRes, schRes, plansRes] = await Promise.all([
          fetch(API + '/stores'),
          fetch(API + '/stats/daily?date=' + date),
          fetch(API + '/schedules?date=' + date),
          fetch(API + '/plans')
        ]);
        stores = await stRes.json();
        const stats = await statsRes.json();
        const schedules = await schRes.json();
        const plans = await plansRes.json();

        const statsMap = {};
        (Array.isArray(stats) ? stats : []).forEach(s => { statsMap[s.store_id || s.id] = s; });
        const planMap = {};
        (Array.isArray(plans) ? plans : []).forEach(p => {
          if (p.plan_date == null) planMap[p.store_id] = p;
        });
        const staffMap = {};
        (Array.isArray(schedules) ? schedules : []).forEach(s => {
          if (!staffMap[s.store_id]) staffMap[s.store_id] = [];
          staffMap[s.store_id].push(s);
        });

        const list = (Array.isArray(stores) ? stores : []).slice().sort((a, b) => (a.hours || 0) - (b.hours || 0));
        if (!list.length) {
          box.innerHTML = '<div class="empty">Нет точек</div>';
          return;
        }

        box.innerHTML = list.map((store, idx) => {
          const fact = statsMap[store.id] || {};
          const plan = planMap[store.id] || {};
          const staff = staffMap[store.id] || [];
          const keys = ['sim', 'mnp', 'pa', 'combo', 'phones'];
          let sf = 0, sp = 0;
          keys.forEach(k => { sf += +fact[k] || 0; sp += +plan[k] || 0; });
          const overall = sp > 0 ? Math.round((sf / sp) * 100) : (sf > 0 ? 100 : 0);

          return `
            <div class="store-card ${idx === 0 ? 'open' : ''}" id="sc-${store.id}">
              <div class="store-head" onclick="toggleStore('${store.id}')">
                <div class="store-badge">${(store.short_name || store.name || '?').slice(0, 2)}</div>
                <div class="store-meta">
                  <div class="store-name">${store.name}</div>
                  <div class="store-code">${store.code || ''} · ${store.work_time || ''}</div>
                </div>
                <div class="store-pct ${pctTone(overall)}">${overall}%</div>
              </div>
              <div class="store-body">
                ${staff.length ? `<div class="chips">${staff.map(s =>
                  `<span class="chip">${s.full_name}${s.shift_text ? ' · ' + s.shift_text : ''}</span>`
                ).join('')}</div>` : '<div class="empty" style="padding:12px 0">Нет на смене</div>'}

                <div class="block-label">Блок GI</div>
                ${progressHTML('Симкарты', fact.sim, plan.sim)}
                ${progressHTML('MNP', fact.mnp, plan.mnp)}
                ${progressHTML('Абики / золото', fact.pa, plan.pa)}

                <div class="block-label">Товарка</div>
                ${progressHTML('Комбо', fact.combo, plan.combo)}
                ${progressHTML('Телефоны', fact.phones, plan.phones)}
                ${progressHTML('Аксессуары', fact.accessories, plan.accessories)}
                ${progressHTML('Страховки', fact.insurance, plan.insurance)}

                <div class="block-label">Ростелеком</div>
                ${progressHTML('WINK', fact.wink, plan.wink)}
                ${progressHTML('ШПД', fact.shpd, plan.shpd)}
                ${progressHTML('ФО', fact.focus, plan.focus)}

                <div class="block-label">Кредиты</div>
                ${progressHTML('Заявка', fact.credit_request, plan.credit_request)}
                ${progressHTML('Выданный', fact.credit_issued, plan.credit_issued)}
              </div>
            </div>`;
        }).join('');
      } catch (e) {
        console.error(e);
        box.innerHTML = '<div class="empty">Ошибка загрузки</div>';
      }
    }

    function toggleStore(id) {
      document.getElementById('sc-' + id)?.classList.toggle('open');
    }

    // ===== TODAY SCHEDULE =====
    async function loadTodaySchedule() {
      const box = document.getElementById('todayList');
      box.innerHTML = '<div class="skeleton"></div>';
      try {
        const date = todayMoscow();
        const [schRes, stRes] = await Promise.all([
          fetch(API + '/schedules?date=' + date),
          fetch(API + '/stores')
        ]);
        const schedules = await schRes.json();
        stores = await stRes.json();

        if (!Array.isArray(schedules) || !schedules.length) {
          box.innerHTML = '<div class="section"><div class="empty">Сегодня никого в графике</div></div>';
          return;
        }

        const byStore = {};
        schedules.forEach(s => {
          if (!byStore[s.store_id]) byStore[s.store_id] = [];
          byStore[s.store_id].push(s);
        });

        box.innerHTML = (Array.isArray(stores) ? stores : []).map(store => {
          const list = byStore[store.id] || [];
          if (!list.length) return '';
          return `
            <div class="section today-store">
              <div class="section-title">${store.name}
                <div class="section-sub">${store.code || ''}</div>
              </div>
              ${list.map(s => `
                <button class="row" onclick="openEmployeeCard(${s.employee_id})">
                  <div class="row-icon">👤</div>
                  <div class="row-body">
                    <div class="row-title">${s.full_name}</div>
                    <div class="row-sub">${s.shift_text || ''} · ${s.hours || ''}ч</div>
                  </div>
                  <div class="row-chevron">›</div>
                </button>
              `).join('')}
            </div>`;
        }).join('') || '<div class="section"><div class="empty">Пусто</div></div>';
      } catch (e) {
        box.innerHTML = '<div class="empty">Ошибка</div>';
      }
    }

    // ===== MONTH SCHEDULE =====
    function shiftMonth(delta) {
      const [y, m] = scheduleMonth.split('-').map(Number);
      const d = new Date(Date.UTC(y, m - 1 + delta, 1));
      scheduleMonth = d.toISOString().slice(0, 7);
      loadMonthSchedule();
    }

    function monthLabel(ym) {
      const names = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      const [y, m] = ym.split('-');
      return names[+m - 1] + ' ' + y;
    }

    function daysInMonth(ym) {
      const [y, m] = ym.split('-').map(Number);
      return new Date(y, m, 0).getDate();
    }

    async function loadMonthSchedule() {
      document.getElementById('monthLabel').textContent = monthLabel(scheduleMonth);
      const box = document.getElementById('monthBoard');
      box.innerHTML = '<div class="skeleton"></div>';
      try {
        const res = await fetch(API + '/schedules/month?month=' + scheduleMonth);
        let data;
        if (res.ok) {
          data = await res.json();
        } else {
          // fallback: empty
          data = { items: [] };
        }
        const items = data.items || [];

        if (!stores.length) {
          const stRes = await fetch(API + '/stores');
          stores = await stRes.json();
        }

        // Всегда полный список сотрудников, смены накладываем поверх
        const empRes = await fetch(API + '/employees');
        const emps = await empRes.json();
        const byEmp = {};
        (emps || []).forEach(e => {
          byEmp[e.id] = { id: e.id, name: e.full_name, days: {} };
        });
        items.forEach(row => {
          const id = row.employee_id;
          if (!byEmp[id]) byEmp[id] = { id, name: row.full_name, days: {} };
          const key = String(row.work_date).slice(0, 10);
          byEmp[id].days[key] = row;
        });

        const total = daysInMonth(scheduleMonth);
        const list = Object.values(byEmp).sort((a, b) => a.name.localeCompare(b.name, 'ru'));
        const editable = canManage();
        const hint = editable
          ? '<div class="empty" style="padding:8px 0 12px">Нажми на день, чтобы поставить / убрать смену</div>'
          : '';

        box.innerHTML = hint + list.map(emp => {
          const workCount = Object.keys(emp.days).length;
          let cells = '';
          for (let d = 1; d <= total; d++) {
            const key = scheduleMonth + '-' + String(d).padStart(2, '0');
            const row = emp.days[key];
            const storeId = row?.store_id || (stores[0] && stores[0].id) || '';
            const hours = row?.hours || 0;
            const click = editable
              ? `onclick="editDay(${emp.id}, '${key}', '${storeId}', ${hours})"`
              : '';
            if (row) {
              const short = (row.store_short || row.store_name || '').slice(0, 4);
              cells += `<div class="sch-cell work" ${click} title="${row.store_name || ''} ${row.shift_text || ''}">
                <div class="d">${d}</div><div class="s">${short}</div></div>`;
            } else {
              cells += `<div class="sch-cell off" ${click}><div class="d">${d}</div></div>`;
            }
          }
          return `
            <div class="sch-emp">
              <div class="sch-emp-head">
                <span>${emp.name}</span>
                <span class="cnt">${workCount} смен</span>
              </div>
              <div class="sch-grid">${cells}</div>
            </div>`;
        }).join('') || '<div class="empty">Нет данных</div>';
      } catch (e) {
        console.error(e);
        box.innerHTML = '<div class="empty">Ошибка загрузки графика</div>';
      }
    }

    async function editDay(employeeId, dateStr, currentStoreId, currentHours) {
      if (!canManage()) return;
      if (!stores.length) {
        const stRes = await fetch(API + '/stores');
        stores = await stRes.json();
      }
      document.getElementById('modalTitle').textContent = 'Смена ' + dateStr;
      document.getElementById('modalBody').innerHTML = `
        <div class="field">
          <label>Точка</label>
          <select id="schStore">
            ${(stores || []).map(s =>
              `<option value="${s.id}" ${s.id === currentStoreId ? 'selected' : ''}>${s.name}</option>`
            ).join('')}
          </select>
        </div>
        <div class="field">
          <label>Часы (0 = выходной)</label>
          <input type="number" id="schHours" value="${currentHours || 0}" min="0" max="14">
        </div>
        <div class="field">
          <label>Смена</label>
          <input id="schText" value="${currentHours ? '10-21' : '10-21'}" placeholder="10-21">
        </div>
        <button class="btn-main" onclick="saveShift(${employeeId}, '${dateStr}')">Сохранить</button>
      `;
      document.getElementById('overlay').classList.add('show');
    }

    async function saveShift(employeeId, dateStr) {
      const store_id = document.getElementById('schStore').value;
      const hours = Number(document.getElementById('schHours').value) || 0;
      const shift_text = document.getElementById('schText').value || '';
      try {
        const res = await fetch(API + '/schedules/bulk', {
          method: 'POST',
          headers: authHeaders(true),
          body: JSON.stringify({
            items: [{ employee_id: employeeId, work_date: dateStr, store_id, hours, shift_text }]
          })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          toast(err.message || 'Нет прав', 'err');
          return;
        }
        toast('Смена сохранена', 'ok');
        closeModal();
        loadMonthSchedule();
      } catch (e) {
        toast('Ошибка', 'err');
      }
    }

    // ===== MY PLAN + BIND =====
    async function loadMyPlan() {
      const body = document.getElementById('myBody');
      const bindSec = document.getElementById('myBindSection');
      body.innerHTML = '<div class="skeleton"></div>';

      const user = tgUser();
      if (user?.photo_url) {
        document.getElementById('userAvatar').innerHTML = `<img src="${user.photo_url}" alt="">`;
      } else if (user?.first_name) {
        document.getElementById('userAvatar').textContent = user.first_name[0];
      }

      try {
        // try /me
        const meRes = await fetch(API + '/me', {
          headers: { 'X-Telegram-Id': String(user?.id || '') }
        });
        if (meRes.ok) {
          me = await meRes.json();
        } else {
          me = null;
        }
      } catch {
        me = null;
      }

      if (!me?.employee_id) {
        document.getElementById('myTitle').textContent = 'Мой план';
        body.innerHTML = '<div class="empty">Привяжите аккаунт к сотруднику</div>';
        bindSec.style.display = 'block';
        const empRes = await fetch(API + '/employees');
        employees = await empRes.json();
        document.getElementById('bindEmployee').innerHTML =
          (employees || []).map(e => `<option value="${e.id}">${e.full_name}</option>`).join('');
        return;
      }

      bindSec.style.display = 'none';
      document.getElementById('myTitle').textContent = me.full_name || 'Мой план';

      try {
        const res = await fetch(API + '/employee/progress/' + me.employee_id + '?date=' + todayMoscow());
        if (!res.ok) throw new Error('no progress');
        const data = await res.json();
        const metrics = [
          { key: 'sim', label: 'SIM' },
          { key: 'mnp', label: 'MNP' },
          { key: 'pa', label: 'ПА' },
          { key: 'combo', label: 'Комбо' },
          { key: 'phones', label: 'Телефоны' }
        ];
        let html = '<div class="progress-block">';
        for (const m of metrics) {
          html += progressHTML(m.label, data[m.key]?.fact, data[m.key]?.plan);
        }
        if (data.total) {
          html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">' +
            progressHTML('Итого', data.total.fact, data.total.plan) + '</div>';
        }
        html += '</div>';
        body.innerHTML = html;
      } catch {
        body.innerHTML = '<div class="empty">Нет данных по плану</div>';
      }
    }

    async function bindMe() {
      const user = tgUser();
      if (!user?.id) {
        toast('Откройте из Telegram', 'err');
        return;
      }
      const employeeId = document.getElementById('bindEmployee').value;
      try {
        const res = await fetch(API + '/me/bind', {
          method: 'POST',
          headers: authHeaders(true),
          body: JSON.stringify({ telegram_id: user.id, employee_id: Number(employeeId) })
        });
        if (!res.ok) throw new Error('bind fail');
        me = await res.json();
        toast('Привязано', 'ok');
        loadMyPlan();
      } catch (e) {
        toast('Ошибка привязки', 'err');
      }
    }

    // ===== TEAM =====
    async function loadTeam() {
      const box = document.getElementById('teamList');
      box.innerHTML = '<div class="skeleton"></div>';
      const tools = document.getElementById('managerTools');
      if (tools) tools.style.display = canManage() ? 'block' : 'none';
      try {
        const [empRes, salesRes] = await Promise.all([
          fetch(API + '/employees'),
          fetch(API + '/sales?date=' + todayMoscow())
        ]);
        employees = await empRes.json();
        const sales = await salesRes.json();
        const map = {};
        (Array.isArray(sales) ? sales : []).forEach(s => {
          if (!map[s.employee_id]) map[s.employee_id] = { sim: 0, phones: 0, combo: 0 };
          map[s.employee_id].sim += +s.sim || 0;
          map[s.employee_id].phones += +s.phones || 0;
          map[s.employee_id].combo += +s.combo || 0;
        });
        const list = Array.isArray(employees) ? employees : [];
        box.innerHTML = list.map(e => {
          const st = map[e.id] || { sim: 0, phones: 0, combo: 0 };
          const roleBadge = e.role === 'manager' || e.role === 'admin' ? ' · ⭐' : '';
          return `
            <button class="row" onclick="openEmployeeCard(${e.id})">
              <div class="row-icon">👤</div>
              <div class="row-body">
                <div class="row-title">${e.full_name}${roleBadge}</div>
                <div class="row-sub">SIM ${st.sim} · Комбо ${st.combo} · Тел ${st.phones}</div>
              </div>
              <div class="row-chevron">›</div>
            </button>`;
        }).join('') || '<div class="empty">Нет сотрудников</div>';
      } catch {
        box.innerHTML = '<div class="empty">Ошибка</div>';
      }
    }

    // ===== Employee card =====
    async function openEmployeeCard(id) {
      document.getElementById('modalTitle').textContent = 'Сотрудник';
      document.getElementById('modalBody').innerHTML = '<div class="empty">Загрузка…</div>';
      document.getElementById('overlay').classList.add('show');

      try {
        const [empRes, salesRes, schRes] = await Promise.all([
          fetch(API + '/employees'),
          fetch(API + '/sales?date=' + todayMoscow()),
          fetch(API + '/schedules?date=' + todayMoscow())
        ]);
        const emps = await empRes.json();
        const sales = await salesRes.json();
        const schedules = await schRes.json();
        const emp = (emps || []).find(e => String(e.id) === String(id));
        const sale = (sales || []).find(s => String(s.employee_id) === String(id));
        const sch = (schedules || []).find(s => String(s.employee_id) === String(id));

        document.getElementById('modalTitle').textContent = emp?.full_name || 'Сотрудник';
        document.getElementById('modalBody').innerHTML = `
          <div class="field">
            <label>Смена сегодня</label>
            <div style="font-size:15px;font-weight:600">
              ${sch ? `${sch.store_name || sch.store_id} · ${sch.shift_text || ''} (${sch.hours || ''}ч)` : 'Выходной / нет в графике'}
            </div>
          </div>
          <div class="block-label">Продажи сегодня</div>
          <div class="progress-block">
            ${progressHTML('SIM', sale?.sim, 0)}
            ${progressHTML('MNP', sale?.mnp, 0)}
            ${progressHTML('ПА', sale?.pa, 0)}
            ${progressHTML('Комбо', sale?.combo, 0)}
            ${progressHTML('Телефоны', sale?.phones, 0)}
            ${progressHTML('Аксессуары', sale?.accessories, 0)}
            ${progressHTML('Wink', sale?.wink, 0)}
            ${progressHTML('ШПД', sale?.shpd, 0)}
          </div>
          <button class="btn-main" onclick="openAddSale(${id})">Добавить продажу</button>
        `;
      } catch (e) {
        document.getElementById('modalBody').innerHTML = '<div class="empty">Ошибка</div>';
      }
    }

    // ===== BFQ =====
    async function loadBFQ() {
      const box = document.getElementById('bfqList');
      box.innerHTML = '<div class="skeleton"></div>';
      try {
        const month = scheduleMonth || todayMoscow().slice(0, 7);
        const res = await fetch(API + '/bfq?month=' + month);
        if (!res.ok) throw new Error('no bfq');
        const data = await res.json();
        const list = Array.isArray(data) ? data : (data.items || []);
        if (!list.length) {
          box.innerHTML = '<div class="empty">Нет данных BFQ</div>';
          return;
        }
        box.innerHTML = list.map((e, i) => `
          <button class="row" onclick="openBFQCard(${e.employee_id})">
            <div class="row-icon">${i + 1}</div>
            <div class="row-body">
              <div class="row-title">${e.full_name || e.name}</div>
              <div class="row-sub">Кач. ${e.quality ?? '—'} · Приб. ${e.profit ?? '—'} · VMR ${e.vmr ?? 0}</div>
            </div>
            <div class="row-value">${e.total ?? e.bfq ?? '—'}</div>
            <div class="row-chevron">›</div>
          </button>
        `).join('');
      } catch {
        box.innerHTML = '<div class="empty">Ошибка BFQ</div>';
      }
    }

    async function openBFQCard(id) {
      document.getElementById('modalTitle').textContent = 'BFQ';
      document.getElementById('modalBody').innerHTML = '<div class="empty">Загрузка…</div>';
      document.getElementById('overlay').classList.add('show');
      try {
        const month = todayMoscow().slice(0, 7);
        const res = await fetch(API + '/bfq/' + id + '?month=' + month);
        const d = await res.json();
        const f = d.fact || {};
        const fc = d.forecast || {};
        let manual = '';
        if (canManage()) {
          manual = `
            <div class="field"><label>VMR средний</label>
              <input type="number" id="bfqVmr" value="${f.vmr || 0}" step="0.1"></div>
            <div class="field"><label>Штраф</label>
              <input type="number" id="bfqPenalty" value="${f.penalty || 0}" step="0.1"></div>
            <button class="btn-main" onclick="saveBFQManual(${id})">Сохранить VMR / штраф</button>`;
        }
        document.getElementById('modalBody').innerHTML = `
          <div class="stats-row">
            <div class="stat-chip"><div class="n">${f.total ?? '—'}</div><div class="l">Факт</div></div>
            <div class="stat-chip"><div class="n">${fc.total ?? '—'}</div><div class="l">Прогноз</div></div>
            <div class="stat-chip"><div class="n">${f.quality ?? '—'}</div><div class="l">Качество</div></div>
          </div>
          <div class="progress-block">
            ${progressHTML('GI', f.blocks?.gi, 50)}
            ${progressHTML('VMR блок', f.blocks?.vmr, 12)}
            ${progressHTML('Digital', f.blocks?.digital, 25)}
            ${progressHTML('Top-up', f.blocks?.topUp, 15)}
            ${progressHTML('Прибыль', f.profit, 20)}
          </div>
          <div class="empty" style="padding:8px 0">
            Смены: ${d.shifts?.worked || 0} отработано · ${d.shifts?.remaining || 0} осталось
          </div>
          ${manual}`;
      } catch {
        document.getElementById('modalBody').innerHTML = '<div class="empty">Ошибка</div>';
      }
    }

    async function saveBFQManual(employeeId) {
      const vmr = Number(document.getElementById('bfqVmr').value) || 0;
      const penalty = Number(document.getElementById('bfqPenalty').value) || 0;
      const month = todayMoscow().slice(0, 7);
      const res = await fetch(API + '/bfq/manual', {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify({ employee_id: employeeId, month, vmr_avg: vmr, penalty })
      });
      if (!res.ok) { toast('Нет прав или ошибка', 'err'); return; }
      toast('Сохранено', 'ok');
      closeModal();
      loadBFQ();
    }

    async function loadHistory() {
      const box = document.getElementById('historyList');
      box.innerHTML = '<div class="skeleton"></div>';
      try {
        const from = todayMoscow().slice(0, 8) + '01';
        const to = todayMoscow();
        const res = await fetch(
          `${API}/sales/history?from=${from}&to=${to}`,
          { headers: authHeaders() }
        );
        if (!res.ok) throw new Error('fail');
        const data = await res.json();
        const items = data.items || [];
        if (!items.length) {
          box.innerHTML = '<div class="empty">Нет продаж за период</div>';
          return;
        }
        box.innerHTML = items.map(s => `
          <div class="row">
            <div class="row-body">
              <div class="row-title">${s.full_name}</div>
              <div class="row-sub">${String(s.sale_date).slice(0, 10)} · ${s.store_name}
                · SIM ${s.sim || 0} · MNP ${s.mnp || 0} · ПА ${s.pa || 0}</div>
            </div>
          </div>
        `).join('');
      } catch {
        box.innerHTML = '<div class="empty">Нужна привязка Telegram</div>';
      }
    }

    async function exportCSV(type) {
      if (!canManage()) { toast('Только управляющий', 'err'); return; }
      const month = todayMoscow().slice(0, 7);
      const from = month + '-01';
      const to = todayMoscow();
      let path = '';
      if (type === 'sales') path = `/export/sales.csv?from=${from}&to=${to}`;
      if (type === 'bfq') path = `/export/bfq.csv?month=${month}`;
      if (type === 'schedules') path = `/export/schedules.csv?month=${month}`;
      try {
        const res = await fetch(API + path, { headers: authHeaders() });
        if (!res.ok) { toast('Ошибка экспорта', 'err'); return; }
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = type + '_' + month + '.csv';
        a.click();
        toast('Скачано', 'ok');
      } catch {
        toast('Ошибка', 'err');
      }
    }

    // ===== ADD SALE (smart) =====
    async function openAddSale(presetEmployeeId) {
      try {
        const [empRes, storeRes, schRes] = await Promise.all([
          fetch(API + '/employees'),
          fetch(API + '/stores'),
          fetch(API + '/schedules?date=' + todayMoscow())
        ]);
        employees = await empRes.json();
        stores = await storeRes.json();
        const schedules = await schRes.json();

        const schByEmp = {};
        (Array.isArray(schedules) ? schedules : []).forEach(s => {
          schByEmp[s.employee_id] = s.store_id;
        });

        // default employee: me, or preset, or first on shift
        let defaultEmp = presetEmployeeId || me?.employee_id || (schedules[0] && schedules[0].employee_id) || employees[0]?.id;
        let defaultStore = schByEmp[defaultEmp] || stores[0]?.id;

        selectedMetric = 'sim';
        document.getElementById('modalTitle').textContent = 'Добавить продажу';
        document.getElementById('modalBody').innerHTML = `
          <div class="field">
            <label>Сотрудник</label>
            <select id="modalEmployee" onchange="onEmpChange()">
              ${(employees || []).map(e =>
                `<option value="${e.id}" ${String(e.id) === String(defaultEmp) ? 'selected' : ''}>${e.full_name}</option>`
              ).join('')}
            </select>
          </div>
          <div class="field">
            <label>Точка <span style="font-weight:500;text-transform:none;color:var(--primary)">(из графика)</span></label>
            <select id="modalStore">
              ${(stores || []).map(s =>
                `<option value="${s.id}" ${s.id === defaultStore ? 'selected' : ''}>${s.name}</option>`
              ).join('')}
            </select>
          </div>
          <div class="field">
            <label>Тип</label>
            <div class="metric-grid">
              ${METRICS.map(m => `
                <button type="button" class="mchip ${m.id === 'sim' ? 'on' : ''}" data-m="${m.id}"
                  onclick="pickMetric('${m.id}')">${m.label}</button>
              `).join('')}
            </div>
          </div>
          <div class="field">
            <label>Количество</label>
            <input type="number" id="modalValue" inputmode="decimal" value="1" min="1">
            <div class="quick">
              <button type="button" onclick="setVal(1)">1</button>
              <button type="button" onclick="setVal(2)">2</button>
              <button type="button" onclick="setVal(5)">5</button>
              <button type="button" onclick="setVal(10)">10</button>
            </div>
          </div>
          <button class="btn-main" onclick="submitSale()">Добавить</button>
        `;

        // store map for smart change
        window._schByEmp = schByEmp;
        document.getElementById('overlay').classList.add('show');
      } catch (e) {
        console.error(e);
        toast('Ошибка загрузки', 'err');
      }
    }

    function onEmpChange() {
      const id = document.getElementById('modalEmployee').value;
      const storeId = window._schByEmp?.[id];
      if (storeId) {
        const sel = document.getElementById('modalStore');
        if (sel) sel.value = storeId;
      }
    }

    function pickMetric(id) {
      selectedMetric = id;
      document.querySelectorAll('.mchip').forEach(b => b.classList.toggle('on', b.dataset.m === id));
    }

    function setVal(n) {
      document.getElementById('modalValue').value = n;
    }

    function closeModal() {
      document.getElementById('overlay').classList.remove('show');
    }

    async function submitSale() {
      const employeeId = document.getElementById('modalEmployee').value;
      const storeId = document.getElementById('modalStore').value;
      const value = Number(String(document.getElementById('modalValue').value).replace(',', '.'));
      if (!value || value <= 0) {
        toast('Введите число', 'err');
        return;
      }
      try {
        const res = await fetch(API + '/sales', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            employee_id: Number(employeeId),
            store_id: storeId,
            sale_date: todayMoscow(),
            [selectedMetric]: value
          })
        });
        if (!res.ok) throw new Error('fail');
        closeModal();
        toast('Добавлено: ' + value, 'ok');
        loadPage(page);
      } catch {
        toast('Ошибка сохранения', 'err');
      }
    }

    // overlay close
    document.getElementById('overlay').addEventListener('click', (e) => {
      if (e.target.id === 'overlay') closeModal();
    });

    // pull-to-refresh simple
    let touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0) touchStartY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (touchStartY && e.changedTouches[0].clientY - touchStartY > 80 && window.scrollY === 0) {
        refreshAll();
      }
      touchStartY = 0;
    }, { passive: true });

    // init
    applyTheme(localStorage.getItem('t2_theme') || 'light');
    document.getElementById('headerDate').textContent = formatDateRu(todayMoscow());
    loadHome();

    // try load me silently
    (async () => {
      const user = tgUser();
      if (!user?.id) return;
      try {
        const res = await fetch(API + '/me', { headers: authHeaders() });
        if (res.ok) me = await res.json();
      } catch (_) {}
    })();

    console.log('Tele2 Sales UI v3 ready');
  </script>
</body>
</html>
