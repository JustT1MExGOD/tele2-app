name: iOS CI

on:
  push:
  workflow_dispatch:

# Same discipline as android-ci.yml: read-only GITHUB_TOKEN, nothing in this
# workflow writes to the repo — the build output is uploaded via
# actions/upload-artifact, not published/committed anywhere.
permissions:
  contents: read

jobs:
  ios:
    # macos-latest ships Xcode preinstalled — xcodebuild only runs on macOS,
    # none of it can run on the Windows dev machine this was scaffolded from.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Install Capacitor CLI dependencies
        working-directory: android
        run: npm ci

      # android/ios is committed (like android/android) — `cap add ios` ran
      # once locally to generate it, this only refreshes web assets/plugins,
      # same role as android-ci.yml's "Capacitor sync" step.
      - name: Capacitor sync
        working-directory: android
        run: npx cap sync ios

      # Capacitor 8's iOS template uses Swift Package Manager, not CocoaPods
      # — no Podfile/`pod install`, so App.xcodeproj (not an .xcworkspace) is
      # the actual build unit. Unsigned build for the iOS Simulator only,
      # proves the app builds/runs, same purpose as android-ci.yml's
      # assembleDebug. A real device/App Store .ipa needs code signing,
      # which needs an Apple Developer Program enrollment (docs/ANDROID-
      # RELEASE.md's keystore.properties has no iOS equivalent yet — nothing
      # to sign with until that enrollment exists).
      - name: Build for iOS Simulator (unsigned)
        working-directory: android/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator .app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t2sales-ios-simulator-app
          path: android/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
