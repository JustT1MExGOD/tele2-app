name: CI

on:
  push:
  workflow_dispatch:

# 20.52.0 (security audit) — без явного permissions: GITHUB_TOKEN
# получает дефолтный набор прав репозитория (может отличаться по
# организации/времени создания репо, но потенциально шире, чем нужно
# этому воркфлоу). Ни один шаг ниже не пишет в репозиторий/пакеты/релизы —
# read-only достаточно.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Прод — Postgres 18.4 (см. sql/migrations/0001_baseline.sql — снят
      # pg_dump 18 оттуда же); версия сервиса должна совпадать, иначе схема
      # может не накатиться из-за синтаксиса/фич, которых нет в более старом Postgres.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: t2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/t2_test
      ALLOW_INSECURE_AUTH: 'true'

    steps:
      # 20.52.0 (security audit) — пиннинг по commit SHA, не мутируемому
      # тегу @v4 (supply-chain: тег может быть переставлен на другой
      # коммит владельцем/скомпрометированным аккаунтом; SHA — нет).
      # Версия в комментарии — только для читаемости, сверяется вручную
      # при обновлении, не источником правды для самого пиннинга.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Data Access Layer — no direct SQL in migrated routes
        run: npm run check:no-direct-sql

      - name: Dangerous JS patterns — document.write/eval/new Function/string-timer-args
        run: npm run check:dangerous-js

      - name: Route auth policy — every route guarded or explicitly public
        run: npm run check:route-auth

      # 17-layer security hardening pass — these two check scripts already
      # existed (added for local/pre-commit use) but were never actually
      # wired into CI, so a regression could only be caught by someone
      # running them manually. Same discipline as the checks above.
      - name: Architecture boundaries — module import discipline
        run: npm run check:architecture

      - name: Circular dependency check
        run: npm run check:circular-deps

      - name: Inline event-handler regression ratchet (onclick=/onchange=/oninput=/onsubmit=)
        run: npm run check:inline-event-handlers

      - name: Local secret-pattern pre-check (working tree only — see the dedicated gitleaks job for full-history scanning)
        run: npm run check:secrets

      - name: Apply migrations to test database
        run: npm run migrate

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check (frontend)
        run: npx tsc --noEmit -p frontend/tsconfig.json

      - name: Build frontend bundle
        run: npm run build:frontend

      - name: Frontend smoke test
        run: npm run smoke:frontend

      - name: Frontend test suite
        run: npm run test:frontend

      - name: Test suite
        run: npm test

  # 17-layer security hardening pass, new Layer 13 (Supply-chain Security)
  # — real, full-git-history secret scanning (separate from the fast
  # working-tree-only `check:secrets` step in the job above, which can't
  # see anything already-committed-then-removed in an earlier commit).
  # `fetch-depth: 0` is required — gitleaks needs full history, the
  # default shallow checkout only has the tip commit.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action annotates findings as a check run — needs write
      # access to that one API, nothing else (no repo/package/release write).
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks — full git history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required if this repo is ever moved under a GitHub
          # Organization (gitleaks-action's README: "Only required for
          # Organizations, not personal accounts") — left unset here since
          # no such secret is configured; if the org requirement ever
          # applies, this step will fail with a clear licensing error
          # rather than silently skipping the scan, which is the correct
          # fail-closed behavior for a security gate.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # 20.55.0 — T2 Edge Relay (relay/) is a small, Node-only, independently
  # deployable service (§16 of the desktop brief: not merged into the
  # main backend) — a second job here rather than a separate workflow
  # file, since it doesn't need Postgres/frontend build/anything the main
  # job's service container provides. `npm test` here is fully local/
  # hermetic (ephemeral local HTTPS fixtures, injectable DNS/CA — no
  # production or public-internet dependency); real-network checks
  # (production /healthz, SSRF-block) live in a separate
  # `test:network-acceptance` script, never run by CI's default job.
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test suite
        run: npm test
