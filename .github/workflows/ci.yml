name: CI

on:
  push:
  workflow_dispatch:

# 20.52.0 (security audit) — без явного permissions: GITHUB_TOKEN
# получает дефолтный набор прав репозитория (может отличаться по
# организации/времени создания репо, но потенциально шире, чем нужно
# этому воркфлоу). Ни один шаг ниже не пишет в репозиторий/пакеты/релизы —
# read-only достаточно.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Прод — Postgres 18.4 (см. sql/migrations/0001_baseline.sql — снят
      # pg_dump 18 оттуда же); версия сервиса должна совпадать, иначе схема
      # может не накатиться из-за синтаксиса/фич, которых нет в более старом Postgres.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: t2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/t2_test
      ALLOW_INSECURE_AUTH: 'true'

    steps:
      # 20.52.0 (security audit) — пиннинг по commit SHA, не мутируемому
      # тегу @v4 (supply-chain: тег может быть переставлен на другой
      # коммит владельцем/скомпрометированным аккаунтом; SHA — нет).
      # Версия в комментарии — только для читаемости, сверяется вручную
      # при обновлении, не источником правды для самого пиннинга.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Data Access Layer — no direct SQL in migrated routes
        run: npm run check:no-direct-sql

      - name: Dangerous JS patterns — document.write/eval/new Function/string-timer-args
        run: npm run check:dangerous-js

      - name: Route auth policy — every route guarded or explicitly public
        run: npm run check:route-auth

      - name: Apply migrations to test database
        run: npm run migrate

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check (frontend)
        run: npx tsc --noEmit -p frontend/tsconfig.json

      - name: Build frontend bundle
        run: npm run build:frontend

      - name: Frontend smoke test
        run: npm run smoke:frontend

      - name: Frontend test suite
        run: npm run test:frontend

      - name: Test suite
        run: npm test

  # 20.55.0 — T2 Edge Relay (relay/) is a small, Node-only, independently
  # deployable service (§16 of the desktop brief: not merged into the
  # main backend) — a second job here rather than a separate workflow
  # file, since it doesn't need Postgres/frontend build/anything the main
  # job's service container provides. `npm test` here is fully local/
  # hermetic (ephemeral local HTTPS fixtures, injectable DNS/CA — no
  # production or public-internet dependency); real-network checks
  # (production /healthz, SSRF-block) live in a separate
  # `test:network-acceptance` script, never run by CI's default job.
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test suite
        run: npm test
