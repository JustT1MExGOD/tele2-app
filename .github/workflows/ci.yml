name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Прод — Postgres 18.4 (см. sql/migrations/0001_baseline.sql — снят
      # pg_dump 18 оттуда же); версия сервиса должна совпадать, иначе схема
      # может не накатиться из-за синтаксиса/фич, которых нет в более старом Postgres.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: t2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/t2_test
      ALLOW_INSECURE_AUTH: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Apply migrations to test database
        run: npm run migrate

      - name: Type check
        run: npx tsc --noEmit

      - name: Frontend smoke test
        run: npm run smoke:frontend

      - name: Test suite
        run: npm test
